<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F1117" />
    <meta name="description" content="Turn Ingredients Into Delicious Meals. Cook Smarter. Waste Less." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>CookMate AI</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        background: #0F1117;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 24px;
        transition: opacity 0.5s ease;
      }
      #splash img.logo {
        width: 120px;
        height: 120px;
        border-radius: 24px;
        margin-bottom: 20px;
        animation: bounceIn 0.6s ease;
      }
      #splash .banner-box {
        border: 2px solid #FFD700;
        border-radius: 16px;
        padding: 8px;
        box-shadow: 0 0 20px rgba(255,215,0,0.3);
        width: 100%;
        max-width: 360px;
      }
      #splash img.banner {
        width: 100%;
        border-radius: 10px;
        display: block;
      }
      @keyframes bounceIn {
        0% { transform: scale(0.5); opacity: 0; }
        80% { transform: scale(1.05); }
        100% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img class="logo" src="%PUBLIC_URL%/logo512.png" alt="CookMate AI"/>
      <div class="banner-box">
        <img class="banner" src="%PUBLIC_URL%/banner.jpg" alt="CookMate Features"/>
      </div>
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('splash');
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(function() { splash.remove(); }, 500);
          }
        }, 2500);
      });
    </script>
  </body>
</html>
